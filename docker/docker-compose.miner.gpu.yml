# GPU visibility for the miner sidecar (nvidia-smi inventory / capacity).
# ASR/TTS GPUs are assigned by stt_install.sh / tts_install.sh (gpu_env.sh).

services:
  violet-miner:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${BT_WALLET_DIR:-${HOME}/.bittensor}:/home/violet/.bittensor:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
