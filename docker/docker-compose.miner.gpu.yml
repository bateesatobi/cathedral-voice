# GPU visibility for the miner sidecar (nvidia-smi inventory / capacity).
# ASR GPUs are assigned by stt_install.sh (gpu_env.sh). TTS uses tts_install.sh.
#
# Wallet mounts belong in docker-compose.miner.prod.yml — keep them out of
# this overlay so nested Docker (shell in container, daemon on host) does not
# fail when ~/.bittensor is missing on the Docker host.

services:
  violet-miner:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
