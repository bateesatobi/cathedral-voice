# Local / laptop overrides for the miner stack (no GPU, no chain).
#
# Used by: violet/miner/start.sh test
#
#   docker compose -f docker/docker-compose.miner.yml \
#                  -f docker/docker-compose.miner.test.yml up -d

services:
  violet-asr:
    ports:
      - "${MOCK_ASR_PORT:-9000}:9000"

  violet-tts:
    ports:
      - "${MOCK_TTS_PORT:-8080}:8080"

  violet-miner:
    # Serve only — no Bittensor registration / announce.
    command: ["--no-chain"]
    environment:
      MINER_PUBLIC_ENDPOINT: ${MINER_PUBLIC_ENDPOINT:-http://127.0.0.1:8091}
      MINER_MAX_CONCURRENT_ASR: ${MINER_MAX_CONCURRENT_ASR:-4}
      MINER_MAX_CONCURRENT_TTS: ${MINER_MAX_CONCURRENT_TTS:-4}
      BT_SIGNING_ENABLED: "false"
