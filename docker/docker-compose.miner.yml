# cathedral-voice miner sidecar only.
#
# ASR (etoil-api) and TTS (Spark) are installed on the host by:
#   ./violet/miner/stt_install.sh
#   ./violet/miner/tts_install.sh
#
# The sidecar proxies public traffic to those upstreams.
#
#   docker compose -f docker/docker-compose.miner.yml up -d

name: violet-miner

services:
  violet-miner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miner
    image: violet/miner:1.4.0
    ports:
      - "${MINER_PORT:-8091}:${MINER_PORT:-8091}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ../.env
        required: false
    environment:
      # etoil-api (ASR) and Spark-TTS on the host — see stt_install / tts_install.sh
      MINER_ASR_UPSTREAM: ${MINER_ASR_UPSTREAM:-http://host.docker.internal:9090}
      MINER_TTS_UPSTREAM: ${MINER_TTS_UPSTREAM:-http://host.docker.internal:8002}
      MINER_HOST: 0.0.0.0
      MINER_PORT: "${MINER_PORT:-8091}"
      MINER_PUBLIC_ENDPOINT: ${MINER_PUBLIC_ENDPOINT:-http://127.0.0.1:${MINER_PORT:-8091}}
      MINER_ASR_STREAM_MODE: ${MINER_ASR_STREAM_MODE:-batch_proxy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${MINER_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    restart: unless-stopped
