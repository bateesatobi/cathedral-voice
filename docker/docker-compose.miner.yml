# A complete Violet miner: the two official inference containers plus the
# sidecar that fronts them.
#
#   docker compose -f docker/docker-compose.miner.yml up -d
#
# Ships pointing at the SAMPLE images so the stack runs anywhere. To go live,
# replace the `image:` on violet-asr and violet-tts with the official published
# images and drop the `build:` block. Nothing else changes - the sample and
# official images speak the same wire contract.

name: violet-miner

services:
  violet-asr:
    # Replace with the official image, e.g.
    #   image: ghcr.io/phosaico/violet-asr:1.4.0
    build:
      context: ..
      dockerfile: docker/Dockerfile.mock
    image: violet/sample-asr:1.4.0
    environment:
      SERVICE: asr
      PORT: "9000"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  violet-tts:
    # Replace with the official image, e.g.
    #   image: ghcr.io/phosaico/violet-tts:1.4.0
    build:
      context: ..
      dockerfile: docker/Dockerfile.mock
    image: violet/sample-tts:1.4.0
    environment:
      SERVICE: tts
      PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  violet-miner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.miner
    image: violet/miner:1.4.0
    depends_on:
      violet-asr:
        condition: service_healthy
      violet-tts:
        condition: service_healthy
    ports:
      - "${MINER_PORT:-8091}:8091"
    env_file:
      - path: ../.env
        required: false
    environment:
      MINER_ASR_UPSTREAM: http://violet-asr:9000
      MINER_TTS_UPSTREAM: http://violet-tts:8080
      MINER_HOST: 0.0.0.0
      MINER_PORT: "8091"
      MINER_PUBLIC_ENDPOINT: ${MINER_PUBLIC_ENDPOINT:-http://127.0.0.1:8091}
    # Wallet / nvidia mounts are added by docker-compose.miner.prod.yml
    # and docker-compose.miner.gpu.yml (see violet/miner/start.sh).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    restart: unless-stopped
