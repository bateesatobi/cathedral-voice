# Production miner extras: wallet for chain announce / signing.
#
# Used by: violet/miner/start.sh prod
#
# Default: named Docker volume (works under nested Docker where the shell's
# ~/.bittensor is not visible to the host daemon).
#
# Bare-metal bind mount (optional):
#   BT_WALLET_BIND=1 BT_WALLET_DIR=$HOME/.bittensor ./violet/miner/start.sh prod
# (start.sh writes a small override when BT_WALLET_BIND=1)

services:
  violet-miner:
    volumes:
      - violet-bittensor-wallets:/home/violet/.bittensor

volumes:
  violet-bittensor-wallets:
    name: violet-bittensor-wallets
    external: true
